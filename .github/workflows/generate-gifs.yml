name: Decode GIF Visualizations
on:
  workflow_dispatch:
  push:
    branches: ['claude/market-making-bot-integration-eMRzh']
    paths: ['docs/img/*.b64*', 'scripts/decode_gifs.py']
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python scripts/decode_gifs.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/img/*.gif
          git rm -f docs/img/*.b64* 2>/dev/null || true
          git diff --staged --quiet || git commit -m "feat: decode animated 3D GIF visualizations from base64 chunks"
          git push
