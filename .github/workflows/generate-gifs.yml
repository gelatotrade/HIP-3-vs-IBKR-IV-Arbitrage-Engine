name: Decode GIF Visualizations
on:
  workflow_dispatch:
  push:
    branches: ['claude/market-making-bot-integration-eMRzh']
    paths:
      - 'docs/img/*.b64*'
      - 'scripts/decode_gifs.py'
      - '.github/workflows/generate-gifs.yml'
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy matplotlib Pillow scipy pandas
      - name: Decode GIFs from base64 chunks
        run: python scripts/decode_gifs.py
      - name: Verify GIFs exist (fallback to generation if needed)
        run: |
          if [ ! -f docs/img/hip3_arbitrage_strategies_3d.gif ]; then
            echo "Arbitrage GIF missing, generating from scratch..."
            python scripts/generate_arbitrage_surfaces.py
          fi
          if [ ! -f docs/img/hip3_greeks_strategies_3d.gif ]; then
            echo "Greeks GIF missing, generating from scratch..."
            python scripts/generate_greeks_strategies_surfaces.py
          fi
      - name: Commit decoded/generated GIFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/img/*.gif
          git rm -f docs/img/*.b64* 2>/dev/null || true
          git diff --staged --quiet || git commit -m "feat: decode animated 3D GIF visualizations from base64 chunks"
          git push
