<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#0e0e1a"/>
<stop offset="100%" stop-color="#080810"/>
</linearGradient>
<linearGradient id="arb" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#0066ff"/>
<stop offset="40%" stop-color="#1a1a2e"/>
<stop offset="60%" stop-color="#1a1a2e"/>
<stop offset="100%" stop-color="#ff2200"/>
</linearGradient>
</defs>
<rect width="720" height="540" fill="url(#bg)"/>
<text x="360" y="40" text-anchor="middle" fill="#00ffcc" font-family="monospace" font-size="16" font-weight="bold">Arbitrage Strategy Surfaces (4 Panels)</text>
<text x="360" y="60" text-anchor="middle" fill="#667788" font-family="monospace" font-size="10">Fixed camera — IV regime cycling low → high → low</text>
<!-- Panel outlines -->
<rect x="20" y="80" width="340" height="200" fill="none" stroke="#334455" stroke-width="1" rx="4"/>
<rect x="380" y="80" width="320" height="200" fill="none" stroke="#334455" stroke-width="1" rx="4"/>
<rect x="20" y="300" width="340" height="200" fill="none" stroke="#334455" stroke-width="1" rx="4"/>
<rect x="380" y="300" width="320" height="200" fill="none" stroke="#334455" stroke-width="1" rx="4"/>
<!-- Panel labels -->
<text x="190" y="100" text-anchor="middle" fill="#cccccc" font-family="monospace" font-size="11">Vol Spread</text>
<text x="540" y="100" text-anchor="middle" fill="#cccccc" font-family="monospace" font-size="11">Term Structure</text>
<text x="190" y="320" text-anchor="middle" fill="#cccccc" font-family="monospace" font-size="11">Skew Arb</text>
<text x="540" y="320" text-anchor="middle" fill="#cccccc" font-family="monospace" font-size="11">Higher-Order Greeks</text>
<!-- Gradient surfaces (stylized) -->
<rect x="40" y="120" width="300" height="140" fill="url(#arb)" opacity="0.6" rx="2"/>
<rect x="400" y="120" width="280" height="140" fill="url(#arb)" opacity="0.6" rx="2"/>
<rect x="40" y="340" width="300" height="140" fill="url(#arb)" opacity="0.6" rx="2"/>
<rect x="400" y="340" width="280" height="140" fill="url(#arb)" opacity="0.6" rx="2"/>
<!-- ARB ZONE markers -->
<text x="190" y="200" text-anchor="middle" fill="#ff3322" font-family="monospace" font-size="12" font-weight="bold">SELL VOL</text>
<text x="100" y="200" text-anchor="middle" fill="#22aaff" font-family="monospace" font-size="12" font-weight="bold">BUY VOL</text>
<text x="540" y="200" text-anchor="middle" fill="#00ffcc" font-family="monospace" font-size="10">ARB ZONE 34%</text>
<text x="190" y="420" text-anchor="middle" fill="#00ffcc" font-family="monospace" font-size="10">ARB ZONE 28%</text>
<text x="540" y="420" text-anchor="middle" fill="#00ffcc" font-family="monospace" font-size="10">TOP DECILE</text>
<!-- Footer -->
<text x="360" y="525" text-anchor="middle" fill="#556677" font-family="monospace" font-size="9">See hip3_arbitrage_strategies_3d.gif for full 24-frame animation</text>
</svg>
